<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ponyhof</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #2533DF;
      --cream: #EDE7CC;
    }


    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      background: url('texture.jpg') center center / cover no-repeat;
      opacity: 0.08;
      mix-blend-mode: luminosity;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--blue);
      color: var(--cream);
      overflow: hidden;
      font-family: 'Space Mono', 'Courier New', monospace;
    }

    #loader {
      position: fixed;
      inset: 0;
      background: var(--blue);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 80px;
    }
    #loader-dots {
      transition: opacity 0.35s ease;
    }
    #loader-dots.fade-out { opacity: 0; }
    #loader-dots {
      font-family: 'Space Mono', monospace;
      font-size: clamp(28px, 4vw, 56px);
      color: var(--cream);
      letter-spacing: -0.05em;
    }

    nav {
      position: fixed;
      top: 0; left: 0;
      padding: 32px 40px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.5s ease;
      background: linear-gradient(to bottom, var(--blue) 60%, transparent);
      pointer-events: none;
    }
    nav img, nav #lang-switcher { pointer-events: auto; }
    nav.visible { opacity: 1; }

    .nav-logo {
      height: 64px;
      width: auto;
      display: block;
    }

    main {
      width: 100vw;
      height: 100vh;
      opacity: 0;
      transition: opacity 0.5s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 80px;
    }

    .site-name {
      font-family: 'Space Mono', 'Courier New', monospace;
      font-weight: 700;
      font-size: clamp(60px, 12vw, 180px);
      text-transform: uppercase;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--cream);
      user-select: none;
    }

    .nav-links {
      display: flex;
      gap: clamp(24px, 5vw, 60px);
      margin-top: clamp(16px, 2.5vw, 32px);
    }

    .nav-links a {
      font-family: 'Space Mono', 'Courier New', monospace;
      font-weight: 400;
      font-size: clamp(18px, 2.5vw, 32px);
      text-transform: lowercase;
      letter-spacing: 0.01em;
      color: var(--cream);
      text-decoration: none;
      opacity: 1;
      transition: opacity 0.15s, font-size 0.2s ease;
    }

    .nav-links a {
      transition: letter-spacing 0.4s cubic-bezier(0.76, 0, 0.24, 1), opacity 0.15s;
    }

    .nav-links a {
      transition: letter-spacing 0.4s cubic-bezier(0.76, 0, 0.24, 1), opacity 0.15s;
    }

    .nav-links a:hover {
      letter-spacing: 0.25em;
    }

    @keyframes workIn {
      0%   { opacity: 0; }
      8%   { opacity: 1; }
      14%  { opacity: 0; }
      22%  { opacity: 1; }
      30%  { opacity: 0; }
      42%  { opacity: 1; }
      100% { opacity: 1; }
    }

    .work-grid {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
    }

    .work-grid.visible {
      display: flex;
    }


    .work-row-wrap {
      width: 100%;
    }

    .work-row-clip {
      overflow: hidden;
      width: 100vw;
      flex-shrink: 0;
      padding-left: 40px;
      overscroll-behavior-x: contain;
    }

    .work-row {
      display: flex;
      flex-direction: row;
      gap: 16px;
      will-change: transform;
    }

    .work-row.animating-in .work-item {
      opacity: 0;
      animation: workIn 0.5s ease forwards;
    }

    .work-row.animating-in .work-item:nth-child(2) { animation-delay: 0.12s; }
    .work-row.animating-in .work-item:nth-child(3) { animation-delay: 0.24s; }
    .work-row.animating-in .work-item:nth-child(4) { animation-delay: 0.36s; }
    .work-row.animating-in .work-item:nth-child(5) { animation-delay: 0.48s; }
    .work-row.animating-in .work-item:nth-child(6) { animation-delay: 0.60s; }

    .work-item {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
    }

    .work-item img {
      width: 240px;
      height: 300px;
      object-fit: cover;
      display: block;
      filter: grayscale(20%);
      transition: filter 0.3s ease, transform 0.3s ease;
    }

    .work-item:hover img {
      filter: grayscale(0%);
      transform: scale(1.02);
    }

    .work-label {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--cream);
      text-transform: lowercase;
    }

    .work-row-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .work-next, .work-prev {
      cursor: pointer;
      color: var(--cream);
      opacity: 0;
      transition: opacity 0.4s ease;
      flex-shrink: 0;
      user-select: none;
    }

    .work-next.visible, .work-prev.visible { opacity: 1; }
    .work-next.visible:hover, .work-prev.visible:hover { opacity: 0.7; }

    @keyframes chevronSlideRight {
      0%   { transform: translateX(0); }
      50%  { transform: translateX(5px); }
      100% { transform: translateX(0); }
    }

    .work-next:hover svg {
      animation: chevronSlideRight 0.5s ease-in-out infinite;
    }

    @keyframes panelFadeIn {
      from { opacity: 0; transform: translateX(10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .work-detail-view {
      display: flex;
      flex-direction: column;
      gap: 32px;
      width: 100%;
      max-width: 100vw;
      min-width: 0;
      padding-left: 40px;
      box-sizing: border-box;
      animation: panelFadeIn 0.35s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    .detail-top {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
      position: relative;
    }

    .detail-top-row {
      display: flex;
      flex-direction: row;
      gap: 32px;
      align-items: flex-start;
      width: 100%;
    }

    #lang-switcher {
      position: fixed;
      top: 24px;
      right: 40px;
      display: flex;
      gap: 12px;
      z-index: 1000;
    }

    .lang-opt {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--cream);
      cursor: pointer;
      opacity: 0.45;
      transition: opacity 0.2s;
    }

    .lang-opt.active {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .lang-opt:hover { opacity: 0.8; }

    .upcoming-tag {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--blue);
      background: var(--cream);
      padding: 4px 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: inline-block;
    }

    .dog-ear {
      position: absolute;
      top: 0;
      left: 0;
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      color: var(--blue);
      background: var(--cream);
      padding: 3px 8px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      z-index: 2;
      pointer-events: none;
    }

    .detail-gallery-wrap {
      overflow: hidden;
      width: calc(100vw - 40px);
    }

    .detail-gallery {
      display: flex;
      flex-direction: row;
      gap: 12px;
      will-change: transform;
    }

    @keyframes galleryScroll {
      from { transform: translateX(0); }
      to   { transform: translateX(var(--gallery-set-width)); }
    }

    .detail-gallery img,
    .detail-gallery video {
      width: 180px;
      height: 220px;
      object-fit: cover;
      display: block;
      flex-shrink: 0;
    }

    .work-detail-view img {
      width: 240px;
      height: 300px;
      object-fit: cover;
      display: block;
      flex-shrink: 0;
    }

    #inline-detail {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 8px 0 0 0;
      flex: 1;
      opacity: 0;
    }

    .detail-footer {
      display: flex;
      gap: 24px;
      align-items: center;
      margin-top: 4px;
    }

    .detail-label {
      font-family: 'Space Mono', monospace;
      font-size: clamp(18px, 2.5vw, 32px);
      color: var(--cream);
      text-transform: lowercase;
    }

    .detail-desc {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--cream);
      line-height: 1.8;
    }

    .desc-char {
      display: inline-block;
      transition: letter-spacing 0.15s cubic-bezier(0.76, 0, 0.24, 1);
    }

    .detail-link {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--cream);
      text-decoration: none;
      transition: opacity 0.15s;
    }

    .detail-link:hover { text-decoration: underline; }

    .detail-back {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--cream);
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 8px;
    }

    .detail-back:hover { opacity: 1; }

    .work-collection-label {
      font-family: 'Space Mono', monospace;
      font-size: clamp(18px, 2.5vw, 32px);
      color: var(--cream);
      opacity: 1;
      text-transform: lowercase;
      letter-spacing: 0.01em;
      user-select: none;
    }

    .contact-info {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .contact-info.visible {
      display: flex;
    }

    .contact-info a {
      font-family: 'Space Mono', 'Courier New', monospace;
      font-weight: 400;
      font-size: clamp(18px, 2.5vw, 30px);
      color: var(--cream);
      text-decoration: none;
      transition: text-decoration 0.15s;
    }

    .contact-info a:hover {
      text-decoration: underline;
    }

    .close-btn {
      margin-top: 16px;
      font-family: 'Space Mono', 'Courier New', monospace;
      font-size: 14px;
      color: var(--cream);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .close-btn.visible { opacity: 1; }
    .close-btn.visible:hover { opacity: 0.7; }

    .work-grid.detail-open #work-close {
      position: fixed;
      left: 40px;
      top: 50%;
      transform: translateY(-50%);
      margin-top: 0;
    }

    .corner-shape {
      position: fixed;
      bottom: 36px;
      right: 40px;
      z-index: 10;
      mix-blend-mode: screen;
    }

    .corner-shape video {
      width: 80px;
      height: auto;
      display: block;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .corner-shape.visible video { opacity: 1; }

    @keyframes chevronSlide {
      0%   { transform: translateX(0); }
      50%  { transform: translateX(-6px); }
      100% { transform: translateX(0); }
    }

    .close-btn:hover svg {
      animation: chevronSlide 0.5s ease-in-out infinite;
    }

    @media (max-width: 600px) {
      nav { padding: 20px; width: 100%; display: flex; justify-content: center; }
      .nav-logo { height: 28px; }
      main { padding-top: 0; justify-content: center; }
      .nav-links { gap: 24px; font-size: 11px; }

      .work-grid { width: 100%; gap: 12px; }

      .work-row-clip {
        padding-left: 20px;
        overflow-x: scroll;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
        overscroll-behavior-x: contain;
      }
      .work-row-clip::-webkit-scrollbar { display: none; }
      .work-item { scroll-snap-align: start; }

      .work-item img {
        width: 75vw;
        height: auto;
        aspect-ratio: 3 / 4;
      }

      .work-label {
        font-size: 10px;
        margin-top: 6px;
      }

      /* detail view stacks vertically on mobile */
      .work-detail-view {
        flex-direction: column;
        gap: 20px;
        width: 100vw;
        padding: 0 20px;
        box-sizing: border-box;
      }

      .work-detail-view img {
        width: 100%;
        height: auto;
        aspect-ratio: 3 / 4;
        transform: none !important;
      }

      #inline-detail {
        padding: 0;
        width: 100%;
      }

      .detail-label {
        font-size: 18px;
      }

      .detail-desc {
        font-size: 11px;
        line-height: 1.7;
        letter-spacing: 0.02em;
      }

      .detail-link {
        font-size: 12px;
        margin-top: 12px;
        display: inline-block;
      }

      .detail-top { gap: 8px; }
      .detail-top-row { gap: 0; flex-direction: column; }

      .work-grid.detail-open {
        position: fixed;
        inset: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        justify-content: flex-start;
        padding: 80px 0 80px;
        align-items: flex-start;
      }

      /* autoscroll gallery — smaller items on mobile */
      .detail-gallery img,
      .detail-gallery video {
        width: 220px !important;
        height: 260px !important;
      }

      /* back arrow on mobile — fixed left-center only when detail is open */
      .work-grid.detail-open #work-close {
        position: fixed !important;
        left: 16px !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
        margin-top: 0 !important;
        z-index: 200;
      }

      .corner-shape { display: none; }

      .upcoming-tag { font-size: 10px; }
      .dog-ear { font-size: 8px; padding: 2px 6px; }
      #lang-switcher { top: 18px; right: 20px; }
    }
  </style>
</head>
<body>

  <div id="loader"><span id="loader-dots"></span></div>

  <nav>
    <img class="nav-logo" src="logo.webp" alt="Ponyhof">
    <div id="lang-switcher">
      <span id="lang-en" class="lang-opt active">En</span>
      <span id="lang-de" class="lang-opt">De</span>
    </div>
  </nav>

  <main>
    <div class="nav-links" id="nav-links">
      <a href="#work" id="nav-work"></a>
      <a href="#" id="contact-btn"></a>
    </div>
    <div class="work-grid" id="work-grid">
      <div class="work-detail-view" id="work-detail-view" style="display:none"></div>
      <div class="work-row-wrap" id="work-row-wrap">
        <div class="work-row-clip" id="work-row-clip"><div class="work-row" id="work-row"></div></div>
      </div>
      <span class="work-collection-label" id="work-collection-label">curated collection</span>
      <span class="close-btn" id="work-close">
        <svg width="40" height="32" viewBox="0 0 40 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polyline points="10,2 2,16 10,30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="24,2 14,16 24,30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="38,2 28,16 38,30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </div>

    <div class="contact-info" id="contact-info">
      <a href="https://instagram.com/ponyhof.studio" target="_blank" id="contact-ig"></a>
      <a href="mailto:contact@ponyhof.studio" id="contact-email"></a>
      <span class="close-btn" id="close-btn">
        <svg width="40" height="32" viewBox="0 0 40 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polyline points="10,2 2,16 10,30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="24,2 14,16 24,30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="38,2 28,16 38,30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </div>
  </main>

  <div class="corner-shape">
    <video autoplay muted loop playsinline>
      <source src="asset.webm" type="video/webm">
      <source src="asset.mp4" type="video/mp4">
    </video>
  </div>

  <script>



    const projects = [
      { img: 'kickz4.webp',       label: 'st. pauli kickz 3x3',   url: 'https://kickz.com',             media: ['kickz1.webp','kickz-nnb.webp','kickz5.webp','kickz-v1.mp4','kickz6.webp','kickz7.webp','kickz8.webp','kickz-v2.mp4'], desc: 'We built and ran social for St. Pauli KICKZ 3x3 from the ground up, producing all short-form photo and video content in-house and travelling with the team across the international FIBA 3x3 circuit. Within 10 months, we grew the account from zero to nearly **3,000** **followers,** while our Instagram Reels generated over **6** **million** **organic** **views** alone. We combined fast, on-the-ground tournament coverage with high-end content for the team, players and brand partners, building a social presence around a rapidly growing 3x3 project, with brand partners including Adidas, Kickz93 and Viva con Agua. The following year, the team became Baskets Bonn Telekom, with Deutsche Telekom coming on as main sponsor.' },
      { img: 'lovelee2.webp',       label: 'Lovelee',           url: 'https://itsloveleee.com',            media: ['lovelee1.webp','lovelee3.webp','lovelee7.webp','lovelee8.webp','lovelee-video.mp4'], desc: 'We run growth for an independent artist end to end. All front and backend, including website, newsletter, outreach, and short & long form content are created in-house. That content brought us over **2.1** **million** **organic** **views,** and together with local press including Fritz Radio and Kickdrum Mag, took lovelee from zero audience in November 2025 to **65,000+** **streams** and **6,914** **monthly** **listeners** across **23+** **countries,** with no label and a small budget. Our Meta ads per-song run at around **€0.13** **per** **click,** with more than one in five listeners saving the song. Every campaign follows the same tested process, so results are measurable and repeatable.' },
      { img: 'rfm-header.webp',    label: 'Rat für Migration', url: 'https://rat-fuer-migration.de', media: ['rfm60.webp','rfm61.webp','rfm62.webp','rfm63.webp','rfm66.webp','rfm67.webp','rfm68.webp'], desc: 'Official event photography, and poster design, for Rat für Migration\'s annual conference, "X Jahre Postmigration", a three-day event in Berlin funded by the Freudenberg Stiftung. Working directly with the organization\'s general management, we covered talks, panels and venue atmosphere across multiple locations in Berlin, including the Museum der „Trostfrauen", Humboldt University and the Kapelle am Urban. The post-production was handled entirely in-house, with the final images delivered within a short turnaround and in time to be used across the organization\'s website and social media.' },
      { img: 'padel.webp',         label: 'Playground Padel',  url: 'https://playgroundpadel.de',    upcoming: true, desc: 'We\'re currently developing the social presence for Playground Padel, an upcoming padel project in Berlin. From creative direction and social strategy to content production and launch, we\'re building the project\'s digital identity from the ground up. More to come.' },
      { img: 'trgrs.webp',         label: 'TRGRS Studios',     url: 'https://trgrs.de',               upcoming: true, desc: 'We\'re currently shaping a new digital identity for TRGRS Studios, rethinking how the Berlin studio space presents itself online. From creative direction and visual language to social strategy and content production, we\'re developing a new look and feel that better reflects the studio, its spaces and the work created within them.' },
    ];

    let currentDetailIndex = 0;
    let currentDetailEl = null;
    const workRow = document.getElementById('work-row');
    const workCounter = document.getElementById('work-counter');

    const detailView = document.getElementById('work-detail-view');

    function showDetail(project, clickedEl) {
      history.pushState({ page: 'detail' }, '');
      currentDetailIndex = parseInt(clickedEl.dataset.index);
      currentDetailEl = clickedEl;

      // fade out carousel
      document.getElementById('work-row-wrap').style.transition = 'opacity 0.15s';
      document.getElementById('work-row-wrap').style.opacity = '0';

      setTimeout(() => {
        document.getElementById('work-row-wrap').style.display = 'none';

        // build detail view
        document.getElementById('work-grid').classList.add('detail-open');
        detailView.style.display = 'flex';
        detailView.style.animation = 'panelFadeIn 0.35s cubic-bezier(0.22,1,0.36,1) forwards';

        // top row: optional upcoming tag + image + text
        const topRow = document.createElement('div');
        topRow.className = 'detail-top';

        if (project.upcoming) {
          const tag = document.createElement('span');
          tag.className = 'upcoming-tag';
          tag.textContent = i18n[currentLang].upcoming_tag;
          topRow.appendChild(tag);
        }

        const innerRow = document.createElement('div');
        innerRow.className = 'detail-top-row';
        const img = document.createElement('img');
        img.src = project.img;
        img.alt = project.label;
        innerRow.appendChild(img);
        const panel = document.createElement('div');
        panel.id = 'inline-detail';
        innerRow.appendChild(panel);
        topRow.appendChild(innerRow);
        detailView.appendChild(topRow);
        updateDetailPanel(panel, project);
        panel.style.animation = 'panelFadeIn 0.4s 0.1s cubic-bezier(0.22,1,0.36,1) forwards';

        // gallery row (if project has media) — autoscrolling loop
        if (project.media) {
          const ITEM_W = window.innerWidth <= 600 ? 220 : 260, GAP = 12, COPIES = 4;
          const N = project.media.length;
          const SET_PX = N * ITEM_W + N * GAP;

          function makeItem(src) {
            let el;
            if (src.endsWith('.mp4') || src.endsWith('.webm')) {
              el = document.createElement('video');
              el.setAttribute('src', src);
              el.setAttribute('autoplay', '');
              el.setAttribute('muted', '');
              el.setAttribute('loop', '');
              el.setAttribute('playsinline', '');
              el.setAttribute('preload', 'auto');
              el.muted = true;
              el.addEventListener('canplay', () => el.play().catch(() => {}), { once: true });
            } else {
              el = document.createElement('img');
              el.src = src;
              el.loading = 'lazy';
              el.decoding = 'async';
            }
            el.style.objectFit = 'cover';
            el.style.display = 'block';

            const isMobile = window.innerWidth <= 600;
            const itemW = isMobile ? 220 : ITEM_W;
            const itemH = isMobile ? 260 : 300;

            // CD cover has white padding — wrap in overflow:hidden and scale up
            if (src === 'lovelee7.webp') {
              const wrap = document.createElement('div');
              wrap.style.cssText = `width:${itemW}px;height:${itemH}px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;`;
              el.style.width = '140%';
              el.style.height = '140%';
              el.style.flexShrink = '0';
              wrap.appendChild(el);
              return wrap;
            }

            el.style.width = itemW + 'px';
            el.style.height = itemH + 'px';
            el.style.flexShrink = '0';
            return el;
          }

          const gallery = document.createElement('div');
          gallery.className = 'detail-gallery';
          for (let c = 0; c < COPIES; c++) {
            project.media.forEach(src => gallery.appendChild(makeItem(src)));
          }

          gallery.style.setProperty('--gallery-set-width', `-${SET_PX}px`);
          gallery.style.animation = `galleryScroll ${N * 6}s linear infinite`;

          const wrap = document.createElement('div');
          wrap.className = 'detail-gallery-wrap';
          wrap.appendChild(gallery);
          detailView.appendChild(wrap);
        }
      }, 160);
    }

    function typewrite(el, text, speed, onDone) {
      el.textContent = '';
      let i = 0;
      const tick = () => {
        el.textContent = text.slice(0, ++i);
        if (i < text.length) setTimeout(tick, speed);
        else if (onDone) onDone();
      };
      setTimeout(tick, speed);
    }

    function attachDescEffect(descEl) {
      if (window.matchMedia('(hover: none)').matches) return;
      descEl.addEventListener('mousemove', e => {
        descEl.querySelectorAll('.desc-char').forEach(span => {
          const rect = span.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const dist = Math.sqrt((e.clientX - cx) ** 2 + (e.clientY - cy) ** 2);
          const strength = Math.max(0, 1 - dist / 120);
          span.style.letterSpacing = (strength * 0.22) + 'em';
        });
      });
      descEl.addEventListener('mouseleave', () => {
        descEl.querySelectorAll('.desc-char').forEach(span => span.style.letterSpacing = '');
      });
    }

    function updateDetailPanel(panel, project) {
      panel.innerHTML = `
        <span class="detail-label"></span>
        <p class="detail-desc" data-project="${project.label}"></p>
        <a class="detail-link" href="${project.url}" target="_blank" style="opacity:0">${i18n[currentLang].visit}</a>`;
      const labelEl = panel.querySelector('.detail-label');
      const descEl = panel.querySelector('.detail-desc');
      const linkEl = panel.querySelector('.detail-link');
      labelEl.textContent = project.label;
      const activeDesc = (projectsI18n[currentLang] && projectsI18n[currentLang][project.label]) || project.desc;
      descEl.innerHTML = activeDesc.split(' ').map(w => {
        const bold = w.startsWith('**') && w.endsWith('**');
        const text = bold ? w.slice(2, -2) : w;
        return `<span class="desc-char"${bold ? ' style="font-weight:700"' : ''}>${text}</span>`;
      }).join(' ');
      attachDescEffect(descEl);
      linkEl.style.opacity = '1';
    }

    function hideDetail() {
      detailView.style.display = 'none';
      detailView.innerHTML = '';
      document.getElementById('work-grid').classList.remove('detail-open');
      const wrap = document.getElementById('work-row-wrap');
      wrap.style.display = '';
      wrap.style.opacity = '';
      wrap.style.transition = '';
      setX(currentPx, false);
    }



    const N = projects.length;
    const COPIES = 20;
    const STRIDE = 256;
    const MIN_PX = -((COPIES * N - 1) * STRIDE);
    let currentPx = 0;
    function setX(px, animate) {
      currentPx = Math.min(0, Math.max(MIN_PX, px));
      workRow.style.transition = animate ? 'transform 0.45s cubic-bezier(0.22,1,0.36,1)' : 'none';
      workRow.style.transform = `translateX(${currentPx}px)`;
    }


    function renderAll() {
      const repeated = Array.from({ length: COPIES }, () => projects).flat();
      workRow.innerHTML = repeated.map((p, i) =>
        `<div class="work-item" data-index="${i % N}">
          <img src="${p.img}" alt="${p.label}">
          ${p.upcoming ? `<span class="dog-ear">${i18n[currentLang].upcoming_dog}</span>` : ''}
          <span class="work-label">${p.label}</span>
        </div>`
      ).join('');
      workRow.querySelectorAll('.work-item').forEach(el => {
        el.addEventListener('click', () => {
          if (document.getElementById('inline-detail')) {
            window.open(projects[el.dataset.index].url, '_blank');
          } else {
            showDetail(projects[el.dataset.index], el);
          }
        });
      });
    }

    function showWork() {
      history.pushState({ page: 'collection' }, '');
      currentPx = 0;
      document.getElementById('work-close').classList.remove('visible');
      const label = document.getElementById('work-collection-label');
      label.textContent = '';
      setTimeout(() => typewrite(label, i18n[currentLang].collection, 45, () => {
        setTimeout(() => {
          renderAll();
          setX(0, false);
          workRow.classList.remove('animating-in');
          void workRow.offsetWidth;
          workRow.classList.add('animating-in');
          setTimeout(() => {
            document.getElementById('work-close').classList.add('visible');
          }, 1400);
        }, 700);
      }), 150);
    }

    // trackpad swipe — follow OS momentum events directly, no snap
    document.getElementById('work-row-clip').addEventListener('wheel', e => {
      if (Math.abs(e.deltaX) < Math.abs(e.deltaY)) return;
      e.preventDefault();
      e.stopPropagation();
      if (document.getElementById('inline-detail')) return;
      workRow.style.transition = 'none';
      setX(currentPx - e.deltaX, false);
    }, { passive: false });

    // touch devices use native CSS scroll (see mobile media query)

    function goHome() {
      const nav = document.querySelector('nav');
      const main = document.querySelector('main');
      nav.style.opacity = '0';
      main.style.opacity = '0';
      setTimeout(() => {
        // fully reset detail state
        const grid = document.getElementById('work-grid');
        grid.classList.remove('visible', 'detail-open');
        const existing = document.getElementById('work-detail-view');
        if (existing) existing.remove();
        const inlineDetail = document.getElementById('inline-detail');
        if (inlineDetail) inlineDetail.remove();
        currentDetailEl = null;
        currentDetailIndex = 0;

        document.getElementById('contact-info').classList.remove('visible');
        document.getElementById('nav-links').style.display = 'flex';
        document.getElementById('nav-work').textContent = '';
        document.getElementById('contact-btn').textContent = '';
        nav.style.opacity = '1';
        main.style.opacity = '1';
        typewriteNav();
      }, 400);
    }

    document.querySelector('.nav-logo').style.cursor = 'pointer';
    document.querySelector('.nav-logo').addEventListener('click', goHome);

    // loader sequence on page load
    (function initLoader() {
      const loader = document.getElementById('loader');
      const dotsEl = document.getElementById('loader-dots');
      const nav = document.querySelector('nav');
      const main = document.querySelector('main');
      const seq = ['.', '..', '...', '..', '.', '..', '...', '..', '.', '..', '...'];
      let i = 0;
      function nextDot() {
        dotsEl.textContent = seq[i++];
        if (i < seq.length) setTimeout(nextDot, 150);
        else setTimeout(() => {          // brief pause on "..."
          dotsEl.classList.add('fade-out');
          setTimeout(() => loader.style.display = 'none', 370);
          setTimeout(() => {
            nav.classList.add('visible');
            main.style.opacity = '1';
            // "work" = 4 chars × 80ms + 120ms gap + "contact" = 7 chars × 80ms ≈ 1080ms total
            typewriteNav();
            setTimeout(() => document.querySelector('.corner-shape').classList.add('visible'), 1150);
          }, 1000);
        }, 300);
      }
      nextDot();
    })();

    document.querySelector('a[href="#work"]').addEventListener('click', e => {
      e.preventDefault();
      document.getElementById('nav-links').style.display = 'none';
      document.getElementById('work-grid').classList.add('visible');
      showWork();
    });

    function updateDetailProject(dir) {
      currentDetailIndex = (currentDetailIndex + dir + projects.length) % projects.length;
      const p = projects[currentDetailIndex];
      const detail = document.getElementById('inline-detail');
      updateDetailPanel(detail, p);
      detailView.querySelector('img').src = p.img;
      detailView.querySelector('img').alt = p.label;
    }

    document.getElementById('work-close').addEventListener('click', () => {
      if (document.getElementById('inline-detail')) {
        history.back();
      } else {
        history.back();
      }
    });

    // history state management
    history.replaceState({ page: 'home' }, '');

    window.addEventListener('popstate', e => {
      const state = e.state || { page: 'home' };
      if (state.page === 'detail') {
        // going forward into detail — just show it (shouldn't normally fire)
      } else if (state.page === 'collection') {
        // came back from detail to collection
        if (document.getElementById('inline-detail')) {
          hideDetail();
        }
      } else {
        // came back to home
        if (document.getElementById('work-grid').classList.contains('visible')) {
          const grid = document.getElementById('work-grid');
          grid.classList.remove('visible', 'detail-open');
          const existing = document.getElementById('work-detail-view');
          if (existing) existing.remove();
          const inlineDetail = document.getElementById('inline-detail');
          if (inlineDetail) inlineDetail.remove();
          currentDetailEl = null;
          document.getElementById('contact-info').classList.remove('visible');
          document.getElementById('nav-links').style.display = 'flex';
          document.getElementById('nav-work').textContent = '';
          document.getElementById('contact-btn').textContent = '';
          typewriteNav();
        }
      }
    });

    const i18n = {
      en: {
        nav_work: 'work',
        nav_contact: 'contact',
        collection: 'curated collection',
        visit: 'visit ↗',
        upcoming_tag: '↗ upcoming project',
        upcoming_dog: '↗ upcoming',
      },
      de: {
        nav_work: 'arbeit',
        nav_contact: 'kontakt',
        collection: 'kuratierte sammlung',
        visit: 'besuchen ↗',
        upcoming_tag: '↗ kommendes projekt',
        upcoming_dog: '↗ demnächst',
      }
    };

    const projectsI18n = {
      en: {
        'st. pauli kickz 3x3': projects.find(p => p.label === 'st. pauli kickz 3x3').desc,
        'Lovelee': projects.find(p => p.label === 'Lovelee').desc,
        'Rat für Migration': projects.find(p => p.label === 'Rat für Migration').desc,
        'Playground Padel': projects.find(p => p.label === 'Playground Padel').desc,
        'TRGRS Studios': projects.find(p => p.label === 'TRGRS Studios').desc,
      },
      de: {
        'st. pauli kickz 3x3': 'Wir haben das Social-Media-Profil für St. Pauli KICKZ 3x3 von Grund auf aufgebaut und betreut – alle Foto- und Videoinhalte wurden intern produziert, während wir das Team auf dem internationalen FIBA 3x3-Circuit begleitet haben. In zehn Monaten wuchs der Account von null auf knapp **3.000** **Follower,** während unsere Instagram Reels allein über **6** **Millionen** **organische** **Views** erzielten. Wir kombinierten schnelle Turnierberichterstattung mit hochwertigen Inhalten für Team, Spieler und Markenpartner – darunter Adidas, Kickz93 und Viva con Agua. Im darauffolgenden Jahr wurde das Team zu Baskets Bonn Telekom, mit der Deutschen Telekom als Hauptsponsor.',
        'Lovelee': 'Wir betreuen das Wachstum einer unabhängigen Künstlerin von A bis Z. Website, Newsletter, Outreach sowie kurze und lange Formate werden vollständig intern erstellt. Diese Inhalte brachten über **2,1** **Millionen** **organische** **Views** und führten – zusammen mit lokaler Presse wie Fritz Radio und Kickdrum Mag – dazu, dass lovelee von null auf **65.000+** **Streams** und **6.914** **monatliche** **Hörer** in **23+** **Ländern** gewachsen ist, ohne Label und mit kleinem Budget. Unsere Meta-Anzeigen kosten etwa **€0,13** **pro** **Klick,** bei einer Save-Rate von mehr als einem von fünf Hörern. Jede Kampagne folgt demselben erprobten Prozess – messbar und wiederholbar.',
        'Rat für Migration': 'Offizielle Eventfotografie und Plakatgestaltung für die Jahreskonferenz von Rat für Migration, „X Jahre Postmigration" – eine dreitägige Veranstaltung in Berlin, gefördert von der Freudenberg Stiftung. In direkter Zusammenarbeit mit der Geschäftsführung begleiteten wir Vorträge, Panels und Atmosphäre an verschiedenen Berliner Locations, darunter das Museum der „Trostfrauen", die Humboldt-Universität und die Kapelle am Urban. Die Postproduktion wurde vollständig intern abgewickelt und die fertigen Bilder pünktlich für Website und Social Media der Organisation geliefert.',
        'Playground Padel': 'Wir entwickeln derzeit die Social-Präsenz für Playground Padel, ein aufstrebendes Padel-Projekt in Berlin. Von der kreativen Leitung über die Inhaltsstrategie bis hin zu Produktion und Launch bauen wir die digitale Identität des Projekts von Grund auf auf. Mehr demnächst.',
        'TRGRS Studios': 'Wir gestalten gerade eine neue digitale Identität für TRGRS Studios und überdenken, wie sich der Berliner Studioraum online präsentiert. Von kreativer Leitung und Bildsprache über Social-Strategie bis hin zur Content-Produktion entwickeln wir einen neuen Look & Feel, der das Studio, seine Räume und die dort entstehende Arbeit besser widerspiegelt.',
      }
    };

    let currentLang = 'en';

    function setLang(lang) {
      currentLang = lang;
      const t = i18n[lang];
      document.getElementById('lang-en').classList.toggle('active', lang === 'en');
      document.getElementById('lang-de').classList.toggle('active', lang === 'de');

      // update collection label if visible
      const collectionLabel = document.getElementById('work-collection-label');
      if (collectionLabel && collectionLabel.textContent) collectionLabel.textContent = t.collection;

      // update nav if already typed
      const navWork = document.getElementById('nav-work');
      const navContact = document.getElementById('contact-btn');
      if (navWork.textContent) navWork.textContent = t.nav_work;
      if (navContact.textContent) navContact.textContent = t.nav_contact;

      // update open detail panel if any
      const openDetail = document.getElementById('inline-detail');
      if (openDetail) {
        const linkEl = openDetail.querySelector('.detail-link');
        if (linkEl) linkEl.textContent = t.visit;
        const descEl = openDetail.querySelector('.detail-desc');
        if (descEl && descEl.dataset.project) {
          const dDesc = projectsI18n[lang][descEl.dataset.project];
          if (dDesc) {
            descEl.innerHTML = dDesc.split(' ').map(w => {
              const bold = w.startsWith('**') && w.endsWith('**');
              const text = bold ? w.slice(2, -2) : w;
              return `<span class="desc-char"${bold ? ' style="font-weight:700"' : ''}>${text}</span>`;
            }).join(' ');
          }
        }
      }

      // update upcoming tags in detail view
      document.querySelectorAll('.upcoming-tag').forEach(el => el.textContent = t.upcoming_tag);
      document.querySelectorAll('.dog-ear').forEach(el => el.textContent = t.upcoming_dog);
    }

    document.getElementById('lang-en').addEventListener('click', () => setLang('en'));
    document.getElementById('lang-de').addEventListener('click', () => setLang('de'));

    function typewriteNav() {
      const t = i18n[currentLang];
      typewrite(document.getElementById('nav-work'), t.nav_work, 80, () => {
        setTimeout(() => typewrite(document.getElementById('contact-btn'), t.nav_contact, 80), 120);
      });
    }

    document.getElementById('contact-btn').addEventListener('click', e => {
      e.preventDefault();
      document.getElementById('nav-links').style.display = 'none';
      const ig = document.getElementById('contact-ig');
      const email = document.getElementById('contact-email');
      ig.textContent = '';
      email.textContent = '';
      document.getElementById('contact-info').classList.add('visible');
      typewrite(ig, '@ponyhof.studio', 28, () => {
        setTimeout(() => typewrite(email, 'contact@ponyhof.studio', 22, () => {
          setTimeout(() => document.getElementById('close-btn').classList.add('visible'), 200);
        }), 100);
      });
    });

    document.getElementById('close-btn').addEventListener('click', () => {
      document.getElementById('close-btn').classList.remove('visible');
      document.getElementById('contact-info').classList.remove('visible');
      document.getElementById('contact-ig').textContent = '';
      document.getElementById('contact-email').textContent = '';
      document.getElementById('nav-links').style.display = 'flex';
    });
    // click outside work items / detail panel → go back
    document.getElementById('work-grid').addEventListener('click', e => {
      if (!e.target.closest('.work-item') && !e.target.closest('#work-detail-view') &&
          !e.target.closest('#work-close') && !e.target.closest('.work-collection-label')) {
        if (document.getElementById('inline-detail')) {
          hideDetail();
        } else if (document.getElementById('work-grid').classList.contains('visible')) {
          document.getElementById('work-grid').classList.remove('visible');
          document.getElementById('nav-links').style.display = 'flex';
        }
      }
    });

  </script>
</body>
</html>
